name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + HTTP tests (incl. the encryption tests - cryptography is required in CI)
        run: |
          python -m pip install -q "cryptography>=42"
          python -m unittest discover -s tests -v
      - name: Self-test (no Steam, no Apollo — expects warnings, not failures)
        run: python bridge/apollo_bridge.py --self-test --no-network --allow-missing-steam

  installer:
    name: Windows installer (lint + dry run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PSScriptAnalyzer (errors fail the build)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path install/windows.ps1 -Severity Error,ParseError
          $r | Format-Table -AutoSize
          if ($r) { throw "PSScriptAnalyzer found errors" }
      - name: Dry run on a real Windows machine (changes nothing)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install/windows.ps1 -DryRun -SteamKey 0123456789ABCDEF0123456789ABCDEF
      - name: Dry run of the uninstall path
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install/windows.ps1 -DryRun -Uninstall
      - name: The bridge runs hidden without a console (pythonw) and logs to a file
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "bridge.log"
          $pyw = Join-Path (Split-Path (Get-Command python).Source) "pythonw.exe"
          $p = Start-Process $pyw -ArgumentList @("bridge/apollo_bridge.py","--steam","C:\nonexistent","--port","8791","--no-network","--log",$log) -PassThru
          $sw = [Diagnostics.Stopwatch]::StartNew(); $ok = $false
          foreach ($i in 1..40) { try { $r = Invoke-WebRequest http://127.0.0.1:8791/pin -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep -Milliseconds 250 } }
          $secs = [math]::Round($sw.Elapsed.TotalSeconds, 1)
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content $log -ErrorAction SilentlyContinue
          Write-Host "answered=$ok after $secs s"
          if (-not $ok) { throw "bridge did not answer under pythonw" }
          if ($secs -gt 10) { throw "bridge took $secs s to answer - it must be reachable within seconds of starting" }
