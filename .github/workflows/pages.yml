name: publish site

on:
  push:
    branches: [main]
    paths: ["web/**", "bridge/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: tests must pass before anything goes live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - name: Sanity-check index.html
        run: |
          test -s web/index.html
          grep -q "Apollo Home Stream" web/index.html
          python3 - <<'PY'
          import re,sys
          s=open("web/index.html",encoding="utf-8").read()
          ids=re.findall(r'\sid="([^"]+)"',s); dup=sorted({i for i in ids if ids.count(i)>1})
          refs=set(re.findall(r'\$\("#([A-Za-z0-9_-]+)"\)',s))|set(re.findall(r'getElementById\("([A-Za-z0-9_-]+)"\)',s))
          missing=sorted(r for r in refs if r not in ids)
          if dup or missing: print("duplicate ids:",dup,"missing ids:",missing); sys.exit(1)
          print("index.html ok:",len(ids),"ids")
          PY

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
