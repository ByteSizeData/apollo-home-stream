name: publish site

on:
  push:
    branches: [main]
    paths: ["web/**", "bridge/**", "sync/**", "tests/**", ".github/workflows/pages.yml"]
  schedule:
    # GitHub runs free-tier schedules when it has spare capacity: measured over a week, "*/30" really ran about
    # every 4 hours. Off-peak minutes queue a little better; the page shows the library's true age either way.
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: tests must pass before anything goes live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -q "cryptography>=42"
          python -m unittest discover -s tests
      - name: Sanity-check index.html
        run: |
          test -s web/index.html
          grep -q "Apollo Home Stream" web/index.html
          python3 - <<'PY'
          import re,sys
          s=open("web/index.html",encoding="utf-8").read()
          ids=re.findall(r'\sid="([^"]+)"',s); dup=sorted({i for i in ids if ids.count(i)>1})
          refs=set(re.findall(r'\$\("#([A-Za-z0-9_-]+)"\)',s))|set(re.findall(r'getElementById\("([A-Za-z0-9_-]+)"\)',s))
          missing=sorted(r for r in refs if r not in ids)
          if dup or missing: print("duplicate ids:",dup,"missing ids:",missing); sys.exit(1)
          print("index.html ok:",len(ids),"ids")
          PY

  deploy:
    needs: check
    outputs:
      sync: ${{ steps.sync.outcome }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write      # re-arm the schedule (GitHub disables schedules after 60 quiet days)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish the installer at a short address
        run: cp install/windows.ps1 web/install.ps1
      - name: Sync your Steam library into the site (skips until the secrets exist)
        id: sync
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
        continue-on-error: true            # a Steam hiccup must not stop the site itself from publishing
        run: |
          python -m pip install -q "cryptography>=42"
          python sync/steam_sync.py --out web/steam.json --status web/sync-status.json
      - name: Steam said no - keep the last good library instead of publishing an empty site
        if: ${{ steps.sync.outcome == 'failure' }}
        continue-on-error: true
        run: |
          curl -fsS --retry 3 --max-time 30 "${{ steps.pages.outputs.base_url }}/steam.json" -o /tmp/last.json
          python - <<'PY'
          import json, shutil
          b = json.load(open("/tmp/last.json"))
          assert b.get("data") and b.get("updated"), "the last published library is not usable"
          shutil.copy("/tmp/last.json", "web/steam.json")
          print("kept the library last synced at", b["updated"])
          PY
      - name: Keep this schedule alive
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable" && echo "schedule re-armed"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  sync-alert:
    # One issue, opened when the Steam sync breaks and closed when it recovers: GitHub emails you once, not six times a day.
    name: Steam sync health
    needs: deploy
    if: ${{ always() && needs.deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SYNC: ${{ needs.deploy.outputs.sync }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or close the "Steam sync is broken" issue
        run: |
          n=$(gh issue list -R "$REPO" --state open --search 'in:title "Steam sync is broken"' --json number --jq '.[0].number // empty')
          if [ "$SYNC" = "failure" ]; then
            if [ -z "$n" ]; then
              gh issue create -R "$REPO" --title "Steam sync is broken" --body "The site still published with the last good library, but Steam refused or did not answer the scheduled sync. Most likely the Steam Web API key was revoked or mistyped: update the STEAM_API_KEY secret (Settings > Secrets and variables > Actions), then run the publish site workflow. This issue closes itself when a sync succeeds. Run: $RUN_URL"
            else
              echo "issue #$n is already open"
            fi
          elif [ -n "$n" ]; then
            gh issue close -R "$REPO" "$n" --comment "A sync succeeded - all good again."
          fi
